services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seoci
      POSTGRES_USER: seoci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seoci_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoci -d seoci"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment: &backend-env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      DATABASE_URL: postgresql+psycopg://seoci:${POSTGRES_PASSWORD:-seoci_local_only}@postgres:5432/seoci
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERP_PROVIDER: ${SERP_PROVIDER:-mock}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      MAX_REVISION_CYCLES: ${MAX_REVISION_CYCLES:-2}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD:-2}
    command: ["sh", "-c", "alembic upgrade head && uvicorn seoci.api.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "seoci.worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
