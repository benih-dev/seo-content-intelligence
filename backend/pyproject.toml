[project]
name = "seoci"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "pydantic-settings>=2",
    "langgraph>=1",
    "langgraph-checkpoint-sqlite>=3",
    "langgraph-checkpoint-postgres>=3",
    "psycopg[binary,pool]>=3",
    "litellm>=1.60",
    "httpx>=0.28",
    "tenacity>=9",
    "markdown-it-py>=3",
    "google-auth[requests]>=2.38",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
